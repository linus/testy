name: NPM
permissions:
  contents: read
on:
  release:
    types: [created]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
      - run: npm cit
      - name: Publish to npm
        run: |
          NPM_TAG=$(node -p "require(\x27./package.json\x27).version.includes(\x27-\x27) ? \x27next\x27 : \x27latest\x27")
          npm publish --access public --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
